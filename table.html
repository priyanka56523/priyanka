<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            color: rgb(3, 3, 3);
          
           
        }
        th, td {
              text-align: center;
            padding: 10px;
            
        }
        tr {
            background-color: #c2baba;
        }
    </style>

 </head>
 <body>
    <table border="1">
      <tr style="background-color: rgb(103, 137, 200);">        
           <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>BCA</td>
        </tr>
        <tr>
            <td>Arjun</td>
            <td>22</td>
            <td>MCA</td>
        </tr>
        <tr>
            <td> Priya</td>
            <td>21</td>
            <td>MBA</td>
        </tr>
        </table> 
</body>
</html>
